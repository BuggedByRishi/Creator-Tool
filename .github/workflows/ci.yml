name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: creatorhq, POSTGRES_PASSWORD: creatorhq, POSTGRES_DB: creatorhq }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U creatorhq" --health-interval 3s --health-retries 10
    env:
      DATABASE_URL: postgres://creatorhq:creatorhq@localhost:5432/creatorhq?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/api ./cmd/api
      - name: smoke test
        run: |
          ./bin/api &
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          ./scripts/smoke.sh
